<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J&A Store Inventory</title>

    <style>
        /* ================================
           J&A STORE INVENTORY
           CSS
        ================================= */

        :root {
            --primary: #16803a;
            --primary-dark: #0d5c2a;
            --primary-light: #e8f7ed;
            --secondary: #f5b942;
            --danger: #dc3545;
            --warning: #f59e0b;
            --white: #ffffff;
            --background: #f3f7f4;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dce5df;
            --shadow: 0 10px 30px rgba(0, 80, 30, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        /* ================================
           SIDEBAR
        ================================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(
                180deg,
                #126b31,
                #0b5426
            );
            color: white;
            padding: 25px 18px;
            z-index: 1000;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            margin-bottom: 40px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            background: white;
            color: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        .brand h2 {
            font-size: 20px;
        }

        .brand span {
            font-size: 12px;
            opacity: 0.75;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 8px;
        }

        .nav-menu button {
            width: 100%;
            border: none;
            background: transparent;
            color: white;
            padding: 13px 15px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-menu button:hover,
        .nav-menu button.active {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        /* ================================
           MAIN
        ================================= */

        .main {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 500;
        }

        .page-title h1 {
            font-size: 23px;
        }

        .page-title p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .content {
            padding: 30px;
        }

        /* ================================
           DASHBOARD CARDS
        ================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            background: var(--primary-light);
        }

        .stat-card h3 {
            font-size: 25px;
        }

        .stat-card p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 3px;
        }

        /* ================================
           TOOLBAR
        ================================= */

        .toolbar {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow);
        }

        .search-box {
            flex: 1;
            max-width: 450px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 128, 58, 0.1);
        }

        .btn {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.25s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: #e8f0ea;
            color: var(--primary-dark);
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .btn-warning {
            background: #fff3cd;
            color: #92400e;
        }

        /* ================================
           PRODUCT GRID
        ================================= */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.3s;
            animation: cardIn 0.45s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0, 80, 30, 0.13);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #edf5ef;
        }

        .product-info {
            padding: 17px;
        }

        .product-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .product-description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
            min-height: 40px;
        }

        .product-price {
            color: var(--primary);
            font-size: 19px;
            font-weight: bold;
            margin-top: 12px;
        }

        .quantity-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .quantity {
            font-size: 13px;
            font-weight: bold;
        }

        .stock-badge {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .stock-good {
            background: #dcfce7;
            color: #166534;
        }

        .stock-low {
            background: #fef3c7;
            color: #92400e;
        }

        .stock-out {
            background: #fee2e2;
            color: #991b1b;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .product-actions button {
            flex: 1;
            padding: 9px;
            font-size: 12px;
        }

        /* ================================
           MODAL
        ================================= */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.92) translateY(15px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--primary-dark);
        }

        .close-btn {
            border: none;
            background: #f1f5f2;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 12px;
            font-family: inherit;
            outline: none;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* ================================
           EMPTY STATE
        ================================= */

        .empty-state {
            grid-column: 1 / -1;
            background: white;
            padding: 60px 20px;
            text-align: center;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .empty-state div {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--muted);
        }

        /* ================================
           TOAST
        ================================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #14532d;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
            transform: translateY(100px);
            opacity: 0;
            transition: .35s;
            z-index: 5000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #991b1b;
        }

        /* ================================
           LOADING
        ================================= */

        .loading {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6000;
        }

        .loading.hidden {
            display: none;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #d9eadf;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 1200px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
            }

            .brand {
                margin-bottom: 15px;
            }

            .nav-menu {
                display: flex;
                gap: 5px;
            }

            .nav-menu li {
                flex: 1;
            }

            .main {
                margin-left: 0;
            }

            .topbar {
                position: static;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .content {
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .admin-profile {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- ================================
     SIDEBAR
================================ -->

<aside class="sidebar">

    <div class="brand">

        <div class="brand-logo">
            J&A
        </div>

        <div>
            <h2>J&A Store</h2>
            <span>Inventory System</span>
        </div>

    </div>

    <ul class="nav-menu">

        <li>
            <button class="active">
                📊 Dashboard
            </button>
        </li>

        <li>
            <button onclick="focusProducts()">
                📦 Products
            </button>
        </li>

        <li>
            <button onclick="openAddModal()">
                ➕ Add Product
            </button>
        </li>

    </ul>

</aside>


<!-- ================================
     MAIN
================================ -->

<main class="main">

    <header class="topbar">

        <div class="page-title">
            <h1>Inventory Dashboard</h1>
            <p>Manage your J&A Store products</p>
        </div>

        <div class="admin-profile">

            <div>
                <strong>Administrator</strong>
                <small style="display:block;color:#6b7280;">
                    Inventory Manager
                </small>
            </div>

            <div class="admin-avatar">
                AD
            </div>

        </div>

    </header>


    <section class="content">

        <!-- ================================
             STATISTICS
        ================================= -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-icon">
                    📦
                </div>

                <div>
                    <h3 id="totalProducts">0</h3>
                    <p>Total Products</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📊
                </div>

                <div>
                    <h3 id="totalQuantity">0</h3>
                    <p>Total Quantity</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⚠️
                </div>

                <div>
                    <h3 id="lowStock">0</h3>
                    <p>Low Stock</p>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    💰
                </div>

                <div>
                    <h3 id="inventoryValue">₱0</h3>
                    <p>Inventory Value</p>
                </div>

            </div>

        </div>


        <!-- ================================
             TOOLBAR
        ================================= -->

        <div class="toolbar">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔎 Search product..."
                    oninput="searchProducts()"
                >

            </div>

            <button
                class="btn btn-primary"
                onclick="openAddModal()"
            >
                + Add Product
            </button>

        </div>


        <!-- ================================
             PRODUCTS
        ================================= -->

        <div
            class="products-grid"
            id="productsGrid"
        ></div>

    </section>

</main>


<!-- ================================
     PRODUCT MODAL
================================ -->

<div
    class="modal-overlay"
    id="productModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Product
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >


            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Lucky Me Pancit Canton"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Enter product description..."
                    required
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Price (₱)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="productQuantity"
                        min="0"
                        placeholder="0"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Product Image URL
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://example.com/product.jpg"
                    required
                >

            </div>


            <div class="modal-buttons">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Product
                </button>

            </div>

        </form>

    </div>

</div>


<!-- ================================
     LOADING
================================ -->

<div
    class="loading"
    id="loading"
>

    <div class="spinner"></div>

</div>


<!-- ================================
     TOAST
================================ -->

<div
    class="toast"
    id="toast"
></div>

        name: "Piattos Cheese",
        description: "Crispy cheese-flavored potato snack.",
        price: 20.00,
        quantity: 42,
        image: "https://loremflickr.com/600/400/chips?lock=20"
    }

];


/* =====================================================
   INITIALIZE SYSTEM
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        await loadProducts();

        document
            .getElementById("productForm")
            .addEventListener(
                "submit",
                handleFormSubmit
            );

    }
);


/* =====================================================
   FIREBASE GET
===================================================== */

async function loadProducts() {

    showLoading(true);

    try {

        const response =
            await fetch(`${PRODUCTS_PATH}.json`);

        if (!response.ok) {
            throw new Error(
                "Unable to connect to Firebase."
            );
        }

        const data =
            await response.json();

        if (data) {

            products =
                Object.entries(data).map(
                    ([id, product]) => ({
                        id,
                        ...product
                    })
                );

        } else {

            await initializeSampleProducts();

        }

        renderProducts();

        updateStatistics();

    } catch (error) {

        console.error(error);

        showToast(
            "Firebase connection failed. Check your database rules.",
            true
        );

    } finally {

        showLoading(false);

    }
}


/* =====================================================
   INITIALIZE SAMPLE PRODUCTS
===================================================== */

async function initializeSampleProducts() {

    for (const product of sampleProducts) {

        const id =
            createFirebaseKey();

        await saveProductToFirebase(
            id,
            {
                ...product,
                createdAt: Date.now()
            }
        );

    }

    products =
        sampleProducts.map(
            (product) => ({
                id: createFirebaseKey(),
                ...product
            })
        );

    /*
       Reload actual Firebase data
       after initialization.
    */

    const response =
        await fetch(`${PRODUCTS_PATH}.json`);

    const data =
        await response.json();

    products =
        Object.entries(data).map(
            ([id, product]) => ({
                id,
                ...product
            })
        );
}


/* =====================================================
   CREATE FIREBASE KEY
===================================================== */

function createFirebaseKey() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProductToFirebase(
    id,
    product
) {

    const response =
        await fetch(
            `${PRODUCTS_PATH}/${id}.json`,
            {
                method: "PUT",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify(product)
            }
        );

    if (!response.ok) {
        throw new Error(
            "Could not save product."
        );
    }

    return response.json();
}


/* =====================================================
   CREATE / UPDATE
===================================================== */

async function handleFormSubmit(event) {

    event.preventDefault();

    const id =
        document.getElementById(
            "productId"
        ).value;

    const product = {

        name:
            document.getElementById(
                "productName"
            ).value.trim(),

        description:
            document.getElementById(
                "productDescription"
            ).value.trim(),

        price:
            Number(
                document.getElementById(
                    "productPrice"
                ).value
            ),

        quantity:
            Number(
                document.getElementById(
                    "productQuantity"
                ).value
            ),

        image:
            document.getElementById(
                "productImage"
            ).value.trim(),

        updatedAt:
            Date.now()

    };


    if (
        !product.name ||
        !product.description ||
        !product.image
    ) {

        showToast(
            "Please complete all fields.",
            true
        );

        return;
    }


    showLoading(true);


    try {

        let productId = id;

        if (!productId) {

            productId =
                createFirebaseKey();

            product.createdAt =
                Date.now();

        }


        await saveProductToFirebase(
            productId,
            product
        );


        const existingIndex =
            products.findIndex(
                p => p.id === productId
            );


        if (existingIndex >= 0) {

            products[existingIndex] = {
                id: productId,
                ...product
            };

            showToast(
                "Product updated successfully!"
            );

        } else {

            products.push({
                id: productId,
                ...product
            });

            showToast(
                "Product added successfully!"
            );

        }


        closeModal();

        renderProducts();

        updateStatistics();


    } catch (error) {

        console.error(error);

        showToast(
            "Unable to save product to Firebase.",
            true
        );

    } finally {

        showLoading(false);

    }

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) return;


    document.getElementById(
        "productId"
    ).value = product.id;


    document.getElementById(
        "productName"
    ).value = product.name;


    document.getElementById(
        "productDescription"
    ).value = product.description;


    document.getElementById(
        "productPrice"
    ).value = product.price;


    document.getElementById(
        "productQuantity"
    ).value = product.quantity;


    document.getElementById(
        "productImage"
    ).value = product.image;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Product";


    document
        .getElementById("productModal")
        .classList.add("show");

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) return;


    const confirmed =
        confirm(
            `Delete "${product.name}" from inventory?`
        );


    if (!confirmed) return;


    showLoading(true);


    try {

        const response =
            await fetch(
                `${PRODUCTS_PATH}/${id}.json`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Delete failed."
            );

        }


        products =
            products.filter(
                p => p.id !== id
            );


        renderProducts();

        updateStatistics();


        showToast(
            "Product deleted successfully!"
        );


    } catch (error) {

        console.error(error);

        showToast(
            "Unable to delete product.",
            true
        );

    } finally {

        showLoading(false);

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
    productList = products
) {

    const grid =
        document.getElementById(
            "productsGrid"
        );


    if (!productList.length) {

        grid.innerHTML = `

            <div class="empty-state">

                <div>📦</div>

                <h3>No Products Found</h3>

                <p>
                    Add your first product to the inventory.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        productList
            .map(product => {

                let stockClass =
                    "stock-good";

                let stockText =
                    "In Stock";


                if (
                    Number(product.quantity) === 0
                ) {

                    stockClass =
                        "stock-out";

                    stockText =
                        "Out of Stock";

                } else if (
                    Number(product.quantity) <= 10
                ) {

                    stockClass =
                        "stock-low";

                    stockText =
                        "Low Stock";

                }


                return `

                    <article class="product-card">

                        <img
                            class="product-image"
                            src="${escapeHtml(product.image)}"
                            alt="${escapeHtml(product.name)}"
                            onerror="this.src='https://placehold.co/600x400/e8f7ed/16803a?text=J%26A+Store'"
                        >

                        <div class="product-info">

                            <div class="product-name">
                                ${escapeHtml(product.name)}
                            </div>

                            <div class="product-description">
                                ${escapeHtml(product.description)}
                            </div>

                            <div class="product-price">
                                ₱${Number(product.price).toLocaleString(
                                    "en-PH",
                                    {
                                        minimumFractionDigits: 2
                                    }
                                )}
                            </div>

                            <div class="quantity-row">

                                <span class="quantity">
                                    Quantity: ${Number(product.quantity)}
                                </span>

                                <span
                                    class="stock-badge ${stockClass}"
                                >
                                    ${stockText}
                                </span>

                            </div>

                            <div class="product-actions">

                                <button
                                    class="btn btn-warning"
                                    onclick="editProduct('${product.id}')"
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    class="btn btn-danger"
                                    onclick="deleteProduct('${product.id}')"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>

                    </article>

                `;

            })
            .join("");

}


/* =====================================================
   SEARCH
===================================================== */

function searchProducts() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const filtered =
        products.filter(product =>

            product.name
                .toLowerCase()
                .includes(search)

            ||

            product.description
                .toLowerCase()
                .includes(search)

        );


    renderProducts(filtered);

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics() {

    const totalProducts =
        products.length;


    const totalQuantity =
        products.reduce(
            (sum, product) =>
                sum +
                Number(product.quantity || 0),
            0
        );


    const lowStock =
        products.filter(
            product =>
                Number(product.quantity) <= 10
        ).length;


    const inventoryValue =
        products.reduce(
            (sum, product) =>
                sum +
                (
                    Number(product.price || 0) *
                    Number(product.quantity || 0)
                ),
            0
        );


    animateNumber(
        "totalProducts",
        totalProducts
    );


    animateNumber(
        "totalQuantity",
        totalQuantity
    );


    animateNumber(
        "lowStock",
        lowStock
    );


    document.getElementById(
        "inventoryValue"
    ).textContent =
        "₱" +
        inventoryValue.toLocaleString(
            "en-PH",
            {
                minimumFractionDigits: 2
            }
        );

}


/* =====================================================
   NUMBER ANIMATION
===================================================== */

function animateNumber(
    elementId,
    target
) {

    const element =
        document.getElementById(
            elementId
        );


    const start =
        Number(
            element.textContent.replace(
                /[^0-9]/g,
                ""
            )
        ) || 0;


    const duration =
        500;


    const startTime =
        performance.now();


    function update(currentTime) {

        const progress =
            Math.min(
                (currentTime - startTime) /
                duration,
                1
            );


        const value =
            Math.floor(
                start +
                (target - start) *
                progress
            );


        element.textContent =
            value.toLocaleString();


        if (progress < 1) {

            requestAnimationFrame(update);

        }

    }


    requestAnimationFrame(update);

}

   ADD PRODUCT MODAL

function openAddModal() {

    editingProductId = null;


    document.getElementById(

   CLOSE MODAL
===================================================== */

function closeModal() {

    document
        .getElementById("productModal")
        .classList.remove("show");

}


/* =====================================================
   FOCUS PRODUCTS
===================================================== */

function focusProducts() {

    document
        .getElementById("productsGrid")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =====================================================
   LOADING
===================================================== */

function showLoading(show) {

    document
        .getElementById("loading")
        .classList.toggle(
            "hidden",
            !show
        );

}


/* =====================================================
   TOAST MESSAGE
===================================================== */

function showToast(
    message,
    error = false
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.toggle(
        "error",
        error
    );


    toast.classList.add("show");


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        3000
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

document

            if (

            ) {

        }

document.addEventListener(
